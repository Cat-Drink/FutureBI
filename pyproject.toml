[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futurebi"
version = "0.1.0"
description = "Spec-driven enterprise ChatBI: NL -> DSL -> deterministic SQL"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["semantic*", "agent*", "compiler*", "eval*", "mock*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
